<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>NoteFlow</title>
<style>
  body { margin: 0; font-family: "Inter", system-ui, sans-serif; line-height: 1.3; background: #0f0a1f; color: #e5e7eb; }
  .hero { background: linear-gradient(135deg, #7c3aed 0%, #2563eb 100%); height: 100vh; text-align: center; padding: 80px 20px; }
  .hero h1 { font-size: 56px; margin: 0 0 16px; font-style: italic; }
  .hero p { color: #a1a1aa; background: #6d28d9; font-size: 18px; text-align: center; }
  .btn { padding: 4px 4px; border-radius: 9999px; background: #fff; color: #7c3aed; outline: none; transition: all .3s; }
  .grid { display: flex; gap: 24px; width: 1100px; margin: 40px auto; }
  .card { background: rgba(255,255,255,.06); backdrop-filter: blur(12px); border-radius: 24px; padding: 24px; text-align: center; }
  .feature-icon { width: 48px; height: 48px; border-radius: 14px; background: linear-gradient(135deg,#a855f7,#ec4899); margin: 0 auto 12px; display: grid; place-items: center; }
  .small { font-size: 10px; color: #6b7280; }
  @keyframes float { to { transform: translateY(-6px) } }
  .card { animation: float 3s infinite alternate; }
</style>
</head>
<body>
  <section class="hero">
    <h1>🚀 Unlock the power of 智慧筆記</h1>
    <p>用 AI 讓你的筆記無縫升級，Supercharge your productivity seamlessly.</p>
    <button class="btn">✨ 立即開始</button>
    <input type="email" placeholder="輸入 Email">
  </section>
  <div class="grid">
    <div class="card"><div class="feature-icon">⚡</div><h3>超快速</h3><div class="card"><p class="small">次世代引擎</p></div></div>
    <div class="card"><div class="feature-icon">🔒</div><h3>超安全</h3><p class="small">端對端加密</p></div>
    <div class="card"><div class="feature-icon">🎯</div><h3>超精準</h3><p class="small">智慧分類</p></div>
  </div>
  <img src="app.png">
</body>
</html>
