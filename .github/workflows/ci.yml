name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}' }
      - run: npm test
      - name: Lint our own demo (must find issues in the sloppy sample)
        shell: bash
        run: |
          node bin/design-sense.mjs check docs/demo/sloppy.html --config test/empty-config.json --fail-on none
          node bin/design-sense.mjs check docs/demo/clean.html --config test/empty-config.json
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with: { paths: docs/demo/clean.html, fail-on: P1 }
