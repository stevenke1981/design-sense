<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width, user-scalable=no">
<style>
  body { font-family: "Inter", sans-serif; line-height: 1.2; }
  .hero { background: linear-gradient(135deg, #7c3aed 0%, #3b82f6 100%); height: 100vh; }
  .title { background: linear-gradient(90deg,#a855f7,#ec4899); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .muted { color: #9ca3af; background-color: #ffffff; }
  .badge { color: #808080; background: #e11d48; }
  .tiny { font-size: 10px; }
  .btn { padding: 2px 4px; border-radius: 9999px; outline: none; transition: all .3s; }
  .chip, .tag, .pill-a, .pill-b, .pill-c, .input-pill { border-radius: 999px; }
  .wrap { width: 1200px; z-index: 99999; }
  .note { border-left: 4px solid #7c3aed; }
  em { font-style: italic; }
  p { word-break: break-all; letter-spacing: -0.02em; }
  @keyframes float { from { transform: translateY(0) } to { transform: translateY(-8px) } }
</style>
</head>
<body>
  <section class="hero">
    <h1 class="title">🚀 Unlock the power of 智慧筆記</h1>
    <h3>Features</h3>
    <div class="card"><div class="card"><p>巢狀卡片</p></div></div>
    <div class="feature-icon"><svg></svg></div><h3>快速</h3>
    <div class="feature-icon"><svg></svg></div><h3>安全</h3>
    <div class="feature-icon"><svg></svg></div><h3>簡單</h3>
    <img src="shot.png">
    <input type="text" placeholder="Email">
    <button><svg viewBox="0 0 10 10"></svg></button>
    <div onclick="go()">Go</div>
    <a href="#">More</a>
    <span tabindex="3">x</span>
    <p><em>重要</em>說明</p>
  </section>
</body>
</html>
