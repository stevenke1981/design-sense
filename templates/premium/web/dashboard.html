<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>控制台 · Aurora 範本</title>
<link rel="stylesheet" href="glass.css">
<script src="theme.js"></script>
<style>
  .shell { max-width: 1240px; margin: 0 auto; padding: var(--s-5); display: grid; grid-template-columns: 240px 1fr; gap: var(--s-5); }
  .side { padding: var(--s-5) var(--s-4); display: flex; flex-direction: column; gap: var(--s-2); align-self: start; position: sticky; top: var(--s-5); }
  .logo { display: flex; align-items: center; gap: var(--s-3); padding: 0 var(--s-2) var(--s-5); font-weight: 700; font-size: 17px; }
  .coin { width: 36px; height: 36px; border-radius: var(--r-sm); background: var(--metal-brush), var(--metal-gold); box-shadow: var(--bevel); display: grid; place-items: center; color: #2a1c02; }
  .coin svg { width: 20px; height: 20px; }
  .nav a { display: flex; align-items: center; min-height: 42px; padding: 0 var(--s-3); border-radius: var(--r-sm); color: var(--text-2); text-decoration: none; font-weight: 600; font-size: 15px; }
  .nav a:hover { background: rgba(255, 255, 255, 0.07); color: var(--text); }
  .nav a[aria-current="page"] { color: var(--text); background: rgba(255, 255, 255, 0.1); box-shadow: inset 0 1px 0 var(--glass-hi); }
  .main { display: grid; gap: var(--s-5); min-width: 0; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: var(--s-4); padding: var(--s-4) var(--s-5); border-radius: var(--r-md); }
  .top h1 { font-size: 24px; }
  .top .actions { display: flex; gap: var(--s-2); align-items: center; }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s-5); }
  .stat { padding: var(--s-5); }
  .stat .k { font-size: 14px; color: var(--text-2); font-weight: 600; }
  .stat .v { font: 700 34px/1.2 var(--font-display); margin: var(--s-2) 0 var(--s-1); font-variant-numeric: tabular-nums; }
  .stat .d { font-size: 14px; color: var(--accent); font-weight: 600; }
  .spark { margin-top: var(--s-3); width: 100%; height: 44px; }
  .grid2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: var(--s-5); }
  .panel { padding: var(--s-5) var(--s-6) var(--s-6); }
  .panel header { display: flex; justify-content: space-between; align-items: center; gap: var(--s-3); margin-bottom: var(--s-5); }
  .panel h2 { font-size: 19px; }
  .set { display: flex; justify-content: space-between; align-items: center; gap: var(--s-4); padding: var(--s-4) 0; border-top: 1px solid var(--glass-edge); }
  .set:first-of-type { border-top: 0; }
  .set b { display: block; font-size: 15px; }
  .set small { display: block; font-size: 14px; color: var(--text-2); }
  .slider-row { display: grid; gap: var(--s-2); padding: var(--s-4) 0; border-top: 1px solid var(--glass-edge); }
  .slider-row div { display: flex; justify-content: space-between; font-size: 15px; }
  .meter { padding: var(--s-5); border-radius: var(--r-md); background: var(--field); border: 1px solid var(--glass-edge); text-align: center; }
  .dial { width: 168px; height: 168px; margin: 0 auto var(--s-4); border-radius: 50%; display: grid; place-items: center;
    background: conic-gradient(var(--accent) 0 72%, rgba(127, 140, 160, 0.25) 72% 100%); box-shadow: var(--shadow-2); }
  .dial span { width: 132px; height: 132px; border-radius: 50%; display: grid; place-items: center; background: var(--metal-brush), var(--metal-titanium); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), inset 0 -2px 6px rgba(0, 0, 0, 0.5); color: #f6f8fb; font: 700 30px/1.1 var(--font-display); }
  .dial small { display: block; font: 600 13px/1.4 var(--font-ui); color: #d5dbe4; }
  .btns { display: flex; gap: var(--s-3); justify-content: center; margin-top: var(--s-5); flex-wrap: wrap; }
  @media (max-width: 960px) { .shell { grid-template-columns: 1fr; } .side { position: static; } .grid2, .stats { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="shell">
  <aside class="glass side" aria-label="主選單">
    <div class="logo"><span class="coin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span>Aurora 語音</div>
    <nav class="nav">
      <a href="#overview" aria-current="page">總覽</a>
      <a href="#history">轉寫紀錄</a>
      <a href="#models">模型管理</a>
      <a href="#hotkeys">快捷鍵</a>
      <a href="#about">關於</a>
    </nav>
  </aside>
  <main class="main">
    <header class="glass top">
      <div><p class="eyebrow">Overview</p><h1>早安，今天也順利</h1></div>
      <div class="actions">
        <div class="tabs" role="tablist" aria-label="時間範圍">
          <button class="tab" role="tab" aria-selected="false" type="button">今天</button>
          <button class="tab" role="tab" aria-selected="true" type="button">本週</button>
          <button class="tab" role="tab" aria-selected="false" type="button">本月</button>
        </div>
        <button class="icon-btn" type="button" aria-label="通知" data-tip="通知"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 0 0 4 0"/></svg></button>
        <button class="icon-btn" type="button" data-theme-toggle aria-label="切換淺色／深色" data-tip="切換主題"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      </div>
    </header>

    <section class="stats" aria-label="本週數據">
      <article class="glass stat"><p class="k">轉寫字數</p><p class="v">48,210</p><p class="d">比上週 +12%</p>
        <svg class="spark" viewBox="0 0 200 44" aria-hidden="true"><path d="M0 34 C30 30 40 12 70 18 S120 36 150 16 185 10 200 6" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"/></svg></article>
      <article class="glass stat"><p class="k">平均延遲</p><p class="v">0.84 秒</p><p class="d">GPU · Vulkan</p>
        <svg class="spark" viewBox="0 0 200 44" aria-hidden="true"><path d="M0 12 C30 20 50 30 80 26 S130 34 160 30 190 36 200 34" fill="none" stroke="#f0c65a" stroke-width="2.5" stroke-linecap="round"/></svg></article>
      <article class="glass stat"><p class="k">辨識準確率</p><p class="v">96.4%</p><p class="d">模型 large-v3-turbo</p>
        <svg class="spark" viewBox="0 0 200 44" aria-hidden="true"><path d="M0 30 C40 28 60 22 90 22 S140 14 170 12 190 10 200 9" fill="none" stroke="#f4725e" stroke-width="2.5" stroke-linecap="round"/></svg></article>
    </section>

    <div class="grid2">
      <section class="glass panel" aria-labelledby="s1">
        <header><h2 id="s1">偏好設定</h2><span class="badge">已同步</span></header>
        <div class="set"><div><b>開機時自動啟動</b><small>登入 Windows 後在背景待命</small></div><label class="switch"><input type="checkbox" checked aria-label="開機時自動啟動"><span aria-hidden="true"></span></label></div>
        <div class="set"><div><b>自動加上標點</b><small>依語氣補上逗號與句號</small></div><label class="switch"><input type="checkbox" checked aria-label="自動加上標點"><span aria-hidden="true"></span></label></div>
        <div class="set"><div><b>轉成繁體中文</b><small>輸出前將簡體字轉為台灣用字</small></div><label class="switch"><input type="checkbox" aria-label="轉成繁體中文"><span aria-hidden="true"></span></label></div>
        <div class="slider-row"><div><label for="sens">麥克風靈敏度</label><output for="sens">70%</output></div><input id="sens" class="range" type="range" min="0" max="100" value="70"></div>
      </section>
      <section class="glass panel" aria-labelledby="s2">
        <header><h2 id="s2">硬體加速</h2><button class="icon-btn" type="button" aria-label="進階設定" data-tip="進階設定"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 14H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10 3V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.7 1.7 0 0 0 21 10h.1a2 2 0 1 1 0 4z"/></svg></button></header>
        <div class="meter">
          <div class="dial"><span><span>72%<small>GPU 使用率</small></span></span></div>
          <p class="muted">NVIDIA GeForce RTX 3060 Ti</p>
        </div>
        <div class="btns"><button class="btn" type="button">重新偵測</button><button class="btn btn--gold" type="button">套用設定</button></div>
      </section>
    </div>
  </main>
</div>
</body>
</html>
