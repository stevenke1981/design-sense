<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登入 · Aurora 範本</title>
<link rel="stylesheet" href="glass.css">
<script src="theme.js"></script>
<style>
  .stage { min-height: 100dvh; display: grid; place-items: center; padding: var(--s-6) var(--s-4); }
  .card { width: min(100%, 420px); padding: var(--s-7) var(--s-6) var(--s-6); border-radius: var(--r-xl); }
  .brand { display: flex; align-items: center; gap: var(--s-3); margin-bottom: var(--s-6); }
  .coin { width: 44px; height: 44px; border-radius: var(--r-sm); background: var(--metal-brush), var(--metal-gold); box-shadow: var(--bevel), var(--shadow-1); display: grid; place-items: center; font: 800 20px/1 var(--font-display); color: #2a1c02; }
  .brand strong { font-size: 18px; }
  .card h1 { font-size: 28px; margin-bottom: var(--s-2); }
  .card form { display: grid; gap: var(--s-4); margin-top: var(--s-5); }
  .row { display: flex; justify-content: space-between; align-items: center; gap: var(--s-3); font-size: 14px; }
  .divider { display: flex; align-items: center; gap: var(--s-3); color: var(--text-3); font-size: 13px; margin: var(--s-2) 0; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--glass-edge); }
  .foot { margin-top: var(--s-5); font-size: 14px; text-align: center; }
  .corner { position: fixed; top: var(--s-4); right: var(--s-4); }
</style>
</head>
<body>
<button class="icon-btn corner" type="button" data-theme-toggle aria-label="切換淺色／深色" data-tip="切換主題"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
<main class="stage">
  <section class="glass glass--raised card" aria-labelledby="t">
    <div class="brand"><span class="coin" aria-hidden="true">A</span><strong>Aurora 工作室</strong></div>
    <h1 id="t">歡迎回來</h1>
    <p class="muted">登入後繼續編輯你的專案。</p>
    <form onsubmit="return false">
      <div class="field"><label for="email">電子郵件</label><input id="email" type="email" autocomplete="email" placeholder="name@example.com"></div>
      <div class="field"><label for="pw">密碼</label><input id="pw" type="password" autocomplete="current-password" placeholder="至少 8 個字元"></div>
      <div class="row">
        <label class="switch"><input type="checkbox" checked><span aria-hidden="true"></span>記住這台電腦</label>
        <a href="#reset">忘記密碼？</a>
      </div>
      <button class="btn btn--gold btn--lg btn--block" type="submit">登入</button>
      <div class="divider">或</div>
      <button class="btn btn--titanium btn--lg btn--block" type="button">使用 GitHub 帳號登入</button>
    </form>
    <p class="foot muted">還沒有帳號？<a href="#signup">建立帳號</a></p>
  </section>
</main>
</body>
</html>
