<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurora 語音 · 範本首頁</title>
<link rel="stylesheet" href="glass.css">
<script src="theme.js"></script>
<style>
  .nav { max-width: 1180px; margin: var(--s-5) auto 0; padding: var(--s-3) var(--s-3) var(--s-3) var(--s-5); display: flex; align-items: center; justify-content: space-between; gap: var(--s-4); border-radius: var(--r-full); }
  .nav .links { display: flex; gap: var(--s-5); align-items: center; font-size: 15px; font-weight: 600; }
  .nav .links a { color: var(--text-2); text-decoration: none; }
  .nav .links a:hover { color: var(--text); }
  .logo { display: flex; align-items: center; gap: var(--s-3); font-weight: 700; }
  .coin { width: 32px; height: 32px; border-radius: 10px; background: var(--metal-brush), var(--metal-gold); box-shadow: var(--bevel); }
  .hero { max-width: 1180px; margin: 0 auto; padding: var(--s-8) var(--s-5); display: grid; grid-template-columns: 1.05fr 1fr; gap: var(--s-7); align-items: center; }
  .hero h1 { font-size: clamp(36px, 5vw, 60px); line-height: 1.2; margin: var(--s-4) 0 var(--s-5); }
  .hero h1 .hl { font-weight: inherit; background: var(--metal-brush), var(--metal-gold); color: #2a1c02; padding: 0 0.18em; border-radius: var(--r-sm); box-shadow: var(--bevel); }
  .hero .lead { font-size: 18px; color: var(--text-2); max-width: 34em; }
  .cta { display: flex; gap: var(--s-3); margin-top: var(--s-6); flex-wrap: wrap; }
  .facts { display: flex; gap: var(--s-6); margin-top: var(--s-6); }
  .facts b { display: block; font: 700 26px/1.2 var(--font-display); }
  .facts span { font-size: 14px; color: var(--text-2); }
  .device { position: relative; padding: var(--s-5); border-radius: var(--r-xl); }
  .window-bar { display: flex; gap: 8px; margin-bottom: var(--s-4); }
  .window-bar i { width: 12px; height: 12px; border-radius: 50%; background: var(--metal-silver); box-shadow: var(--bevel); }
  .wave { height: 120px; border-radius: var(--r-md); background: var(--field); border: 1px solid var(--glass-edge); display: flex; align-items: center; justify-content: center; gap: 5px; }
  .wave i { width: 6px; border-radius: 3px; background: linear-gradient(180deg, var(--accent), #f0c65a); }
  .transcript { margin-top: var(--s-4); padding: var(--s-4) var(--s-5); border-radius: var(--r-md); background: var(--field); border: 1px solid var(--glass-edge); font-size: 16px; }
  .transcript small { display: block; color: var(--text-3); font-size: 13px; margin-bottom: var(--s-1); }
  .float { position: absolute; padding: var(--s-3) var(--s-4); border-radius: var(--r-md); font-size: 14px; font-weight: 600; }
  .float.a { right: -18px; top: -22px; }
  .float.b { left: -28px; bottom: 34px; }
  .rec { width: 64px; height: 64px; margin: var(--s-5) auto 0; display: grid; place-items: center; border-radius: 50%; background: var(--metal-brush), var(--metal-titanium); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), var(--shadow-2); border: 1px solid rgba(0,0,0,.5); }
  .rec span { width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffb4a6, #e5484d 60%, #9b1c1f); box-shadow: 0 0 18px rgba(229, 72, 77, 0.7); }
  @media (max-width: 920px) { .hero { grid-template-columns: 1fr; padding-top: var(--s-7); } .nav .links a { display: none; } .float { display: none; } }
</style>
</head>
<body>
<header class="glass nav">
  <div class="logo"><span class="coin" aria-hidden="true"></span>Aurora 語音</div>
  <nav class="links" aria-label="主選單">
    <a href="#features">功能</a><a href="#pricing">方案</a><a href="#docs">說明文件</a>
    <button class="icon-btn" type="button" data-theme-toggle aria-label="切換淺色／深色" data-tip="切換主題"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    <a class="btn btn--gold" href="#download">免費下載</a>
  </nav>
</header>
<main class="hero">
  <div>
    <span class="badge">v2.0 · 支援 Vulkan 與 CUDA</span>
    <h1>按下快捷鍵，<br>說完就<strong class="hl">打好字</strong></h1>
    <p class="lead">在任何視窗裡直接用說的輸入。語音只在你的電腦上處理，不上傳雲端，離線也能用。</p>
    <div class="cta">
      <a class="btn btn--gold btn--lg" href="#download">下載 Windows 版</a>
      <a class="btn btn--ghost btn--lg" href="#docs">看使用說明</a>
    </div>
    <div class="facts">
      <div><b>0.8 秒</b><span>平均出字時間</span></div>
      <div><b>99 種</b><span>支援語言</span></div>
      <div><b>13 MB</b><span>安裝檔大小</span></div>
    </div>
  </div>
  <div class="glass glass--raised device" aria-label="產品畫面示意">
    <div class="window-bar" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="wave" aria-hidden="true">
      <i style="height:18px"></i><i style="height:34px"></i><i style="height:58px"></i><i style="height:80px"></i><i style="height:46px"></i><i style="height:70px"></i><i style="height:92px"></i><i style="height:60px"></i><i style="height:38px"></i><i style="height:66px"></i><i style="height:84px"></i><i style="height:50px"></i><i style="height:28px"></i><i style="height:44px"></i><i style="height:22px"></i>
    </div>
    <div class="transcript"><small>即時轉寫</small>明天下午三點跟設計團隊開會，記得帶上新版的簡報。</div>
    <div class="rec" aria-hidden="true"><span></span></div>
    <div class="glass float a">GPU 加速中</div>
    <div class="glass float b">已轉為繁體中文</div>
  </div>
</main>
</body>
</html>
